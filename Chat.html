<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defensoría Oficial – Chat</title>
<style>
:root{--bar:#008069;--bg:#f0f2f5;--panel:#fff;--chat:#efeae2;--out:#d9fdd3;--in:#fff;--txt:#111b21;--sub:#667781;--line:#e9edef;--acc:#00a884;--hov:#f5f6f6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#202c33;--bg:#0b141a;--panel:#111b21;--chat:#0b141a;--out:#005c4b;--in:#202c33;--txt:#e9edef;--sub:#8696a0;--line:#222d34;--hov:#202c33;color-scheme:dark}}
:root[data-theme="dark"]{--bar:#202c33;--bg:#0b141a;--panel:#111b21;--chat:#0b141a;--out:#005c4b;--in:#202c33;--txt:#e9edef;--sub:#8696a0;--line:#222d34;--hov:#202c33;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,"Segoe UI",Helvetica,Arial,sans-serif}
button,input{font:inherit;color:inherit}
#app{height:100%;display:flex;max-width:1400px;margin:0 auto;background:var(--panel)}
.center{margin:auto;text-align:center;padding:24px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.logo{font-size:56px}
h1{margin:0;font-size:22px;font-weight:600}
.sub{color:var(--sub);font-size:13px;margin:0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:24px;padding:12px 20px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.field{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:11px 12px;width:100%;outline:none}
.field:focus{border-color:var(--acc)}
.err{color:#d93025;font-size:13px;min-height:18px;margin:0}
.side{width:380px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
.main,.single{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat)}
.bar{background:var(--bar);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:58px}
.side .bar{justify-content:space-between}
.bar .t{font-weight:600;font-size:16px}
.bar .s{font-size:12px;opacity:.8}
.ib{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:50%}
.back{display:none}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600}
.search{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.search .field{border-radius:8px;background:var(--bg);border:0;padding:8px 12px}
#list{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;padding:10px 14px;cursor:pointer;align-items:center;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--hov)}
.row .mid{flex:1;min-width:0}
.row .n{font-weight:500;display:flex;justify-content:space-between;gap:8px}
.row .n small{color:var(--sub);font-weight:400;font-size:12px}
.row .p{color:var(--sub);font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.row .p span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--acc);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;text-align:center;line-height:20px;font-weight:600}
.empty{padding:32px 20px;text-align:center;color:var(--sub);font-size:14px}
.ph{margin:auto;text-align:center;color:var(--sub);padding:24px}
#msgs{flex:1;overflow-y:auto;padding:12px 8%;display:flex;flex-direction:column;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.day{align-self:center;margin:10px 0}
.day span{background:var(--in);color:var(--sub);font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.b{max-width:78%;margin:2px 0;padding:6px 8px 6px 9px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);overflow-wrap:anywhere;white-space:pre-wrap}
.b.out{align-self:flex-end;background:var(--out);border-top-right-radius:0}
.b.in{align-self:flex-start;background:var(--in);border-top-left-radius:0}
.meta{float:right;margin:7px 0 -4px 12px;font-size:11px;color:var(--sub);white-space:nowrap}
.tk{font-style:normal;color:#53bdeb}
.comp{display:flex;gap:8px;padding:8px 10px;background:var(--bar);align-items:center}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .comp{background:var(--bg)}}
.comp input{flex:1;border:0;border-radius:22px;padding:11px 16px;background:var(--in);outline:none}
.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--acc);color:#fff;font-size:18px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--panel);border-radius:12px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:18px}
.acts{display:flex;gap:8px;justify-content:flex-end}
.acts .btn{padding:8px 16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:30}
@media(max-width:700px){
.side{width:100%;border:0}.main{display:none}
#app.open .side{display:none}#app.open .main{display:flex}
.back{display:block}#msgs{padding:12px 10px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clean=s=>String(s).replace(/\D/g,'');
const tm=t=>new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const dayLbl=t=>{const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return'Hoy';if(d.toDateString()===new Date(n-864e5).toDateString())return'Ayer';return d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})};
const hue=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const av=n=>`<div class="av" style="background:hsl(${hue(n)} 45% 42%)">${esc(((n||'?').trim()[0]||'?').toUpperCase())}</div>`;
let db=null,user=null,unsubs=[],contacts={},msgs=[],active=null,me=null,phone=null;
function stop(){unsubs.forEach(f=>f());unsubs=[];msgs=[];contacts={};active=null}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function logout(){store.set('wd',null);showRole()}

/* ---------- Pantalla inicial ---------- */
function showRole(note){
  stop();me=null;$('#app').className='';
  $('#app').innerHTML=`<div class="center"><div class="logo">⚖️</div><h1>Defensoría Oficial</h1>
  <p class="sub">Mensajería entre la Defensoría y las personas asistidas</p>
  <button class="btn" id="rc">Soy cliente</button>
  <button class="btn alt" id="re">Soy de la Defensoría</button>
  <p class="err" id="note">${esc(note||'')}</p></div>`;
  $('#rc').onclick=()=>db?showLogin():($('#note').textContent='Sincronización no disponible. Abre el enlace con tu sesión iniciada.');
  $('#re').onclick=()=>{if(!db)return $('#note').textContent='Sincronización no disponible. Abre el enlace con tu sesión iniciada.';
    if(!(user&&user.canEdit()))return $('#note').textContent='Acceso solo para el personal autorizado de la Defensoría.';
    store.set('wd',{role:'staff'});enterStaff()};
}

/* ---------- Cliente ---------- */
function showLogin(err){
  $('#app').innerHTML=`<div class="center"><div class="logo">💬</div><h1>Ingresa tu número</h1>
  <p class="sub">Usa el número con el que la Defensoría te registró como contacto.</p>
  <input class="field" id="ph" type="tel" inputmode="tel" placeholder="Ej.: 3764123456" autocomplete="tel">
  <p class="err" id="er">${esc(err||'')}</p>
  <button class="btn" id="go">Entrar</button><button class="btn alt" id="bk">Volver</button></div>`;
  $('#bk').onclick=()=>showRole();
  const go=()=>{const p=clean($('#ph').value);if(p.length<6)return $('#er').textContent='Número no válido.';enterClient(p,true)};
  $('#go').onclick=go;$('#ph').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function enterClient(p,fromLogin){
  let snap;try{snap=await db.doc('contacts/'+p).get()}catch(e){return fromLogin?showLogin('No se pudo verificar. Intenta de nuevo.'):showRole()}
  if(!snap.exists){store.set('wd',null);return showLogin('Este número no está registrado. Comunícate con la Defensoría.')}
  stop();me='client';phone=p;store.set('wd',{role:'client',phone:p});
  $('#app').className='';
  $('#app').innerHTML=`<div class="single"><div class="bar">${av('Defensoría Oficial')}<div style="flex:1"><div class="t">Defensoría Oficial</div><div class="s">Hola, ${esc(snap.data().name||'')}</div></div><button class="ib" id="out" title="Salir" style="font-size:14px">Salir</button></div>
  <div id="msgs"></div>${composer()}</div>`;
  $('#out').onclick=logout;wireComposer();
  unsubs.push(db.collection('msgs').where('cid','==',p).onSnapshot(s=>{msgs=s.docs.map(d=>d.data());renderMsgs()},()=>toast('Error de conexión')));
  renderMsgs();
}

/* ---------- Personal de la Defensoría ---------- */
function enterStaff(){
  stop();me='staff';
  $('#app').className='';
  $('#app').innerHTML=`<div class="side"><div class="bar"><div class="t">Defensoría Oficial</div><div><button class="ib" id="add" title="Nuevo contacto">➕</button><button class="ib" id="out" title="Salir" style="font-size:14px">Salir</button></div></div>
  <div class="search"><input class="field" id="q" placeholder="Buscar o empezar un chat"></div><div id="list"></div></div>
  <div class="main" id="main"><div class="ph"><div class="logo">⚖️</div><p>Selecciona un chat para ver la conversación</p></div></div>`;
  $('#out').onclick=logout;$('#add').onclick=addContact;$('#q').oninput=renderSide;
  $('#list').onclick=e=>{const r=e.target.closest('.row');if(r)openChat(r.dataset.id)};
  unsubs.push(db.collection('contacts').onSnapshot(s=>{contacts={};s.docs.forEach(d=>contacts[d.id]=d.data());renderSide()},()=>toast('Error de conexión')));
  unsubs.push(db.collection('msgs').onSnapshot(s=>{msgs=s.docs.map(d=>d.data());renderSide();renderMsgs()},()=>toast('Error de conexión')));
}
function renderSide(){
  const el=$('#list');if(!el)return;
  const q=($('#q').value||'').toLowerCase(),lr=store.get('lr')||{};
  const rows=Object.entries(contacts).map(([id,c])=>{
    const ms=msgs.filter(m=>m.cid===id);
    const last=ms.reduce((a,m)=>!a||m.ts>a.ts?m:a,null);
    const un=id===active?0:ms.filter(m=>m.from==='client'&&m.ts>(lr[id]||0)).length;
    return{id,c,last,un}}).filter(r=>((r.c.name||'')+r.id).toLowerCase().includes(q))
    .sort((a,b)=>((b.last&&b.last.ts)||b.c.createdAt||0)-((a.last&&a.last.ts)||a.c.createdAt||0));
  el.innerHTML=rows.map(r=>`<div class="row${r.id===active?' on':''}" data-id="${esc(r.id)}">${av(r.c.name)}<div class="mid"><div class="n"><span>${esc(r.c.name)}</span><small>${r.last?tm(r.last.ts):''}</small></div><div class="p"><span>${r.last?(r.last.from==='staff'?'✓ ':'')+esc(r.last.text):esc(r.id)}</span>${r.un?`<span class="badge">${r.un}</span>`:''}</div></div></div>`).join('')
    ||'<div class="empty">Aún no hay contactos.<br>Usa ➕ para registrar a una persona asistida.</div>';
}
function openChat(id){
  active=id;const c=contacts[id]||{};
  $('#app').classList.add('open');
  $('#main').className='main';
  $('#main').innerHTML=`<div class="bar"><button class="ib back" id="bk">←</button>${av(c.name)}<div><div class="t">${esc(c.name)}</div><div class="s">+${esc(id)}</div></div></div><div id="msgs"></div>${composer()}`;
  $('#bk').onclick=()=>{active=null;$('#app').classList.remove('open');renderSide()};
  wireComposer();renderMsgs();renderSide();
  if(window.innerWidth>700)$('#inp').focus();
}
function addContact(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card"><h2>Nuevo contacto</h2><input class="field" id="cn" placeholder="Nombre y apellido"><input class="field" id="cp" type="tel" inputmode="tel" placeholder="Número de teléfono"><p class="err" id="ce"></p><div class="acts"><button class="btn alt" id="cc">Cancelar</button><button class="btn" id="cs">Guardar</button></div></div>`;
  document.body.appendChild(m);$('#cn').focus();
  $('#cc').onclick=()=>m.remove();
  $('#cs').onclick=async()=>{
    const n=$('#cn').value.trim(),p=clean($('#cp').value);
    if(!n||p.length<6)return $('#ce').textContent='Ingresa nombre y un número válido.';
    try{await db.doc('contacts/'+p).set({name:n.slice(0,80),phone:p,createdAt:Date.now()});m.remove();toast('Contacto registrado')}
    catch(e){$('#ce').textContent='No se pudo guardar.'}};
}

/* ---------- Chat común ---------- */
function composer(){return`<div class="comp"><input id="inp" placeholder="Escribe un mensaje" autocomplete="off" maxlength="2000"><button class="send" id="send" title="Enviar">➤</button></div>`}
function wireComposer(){$('#send').onclick=send;$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}}
const curCid=()=>me==='staff'?active:phone;
function renderMsgs(){
  const el=$('#msgs'),cid=curCid();if(!el||!cid)return;
  const list=msgs.filter(m=>m.cid===cid).sort((a,b)=>a.ts-b.ts);
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<80;
  const mineFrom=me==='staff'?'staff':'client';
  let h='',last='';
  list.forEach(m=>{const d=dayLbl(m.ts);if(d!==last){h+=`<div class="day"><span>${d}</span></div>`;last=d}
    const mine=m.from===mineFrom;
    h+=`<div class="b ${mine?'out':'in'}">${esc(m.text)}<span class="meta">${tm(m.ts)}${mine?' <i class="tk">✓✓</i>':''}</span></div>`});
  el.innerHTML=h||'<div class="day"><span>Aún no hay mensajes</span></div>';
  if(near||el._c!==cid){el.scrollTop=el.scrollHeight;el._c=cid}
  if(me==='staff'&&list.length){const lr=store.get('lr')||{},mx=list[list.length-1].ts;if((lr[cid]||0)<mx){lr[cid]=mx;store.set('lr',lr);renderSide()}}
}
async function send(){
  const i=$('#inp'),t=i.value.trim(),cid=curCid();if(!t||!cid)return;
  i.value='';
  try{await db.collection('msgs').add({cid,from:me==='staff'?'staff':'client',text:t.slice(0,2000),ts:Date.now()})}
  catch(e){i.value=t;toast('No se pudo enviar el mensaje')}
}

/* ---------- Inicio ---------- */
showRole();
(async()=>{
  try{if(window.claude&&claude.use){db=await claude.use('db');user=await claude.use('user')}}catch(e){}
  const s=store.get('wd');
  if(!db||!s)return;
  if(s.role==='client'&&s.phone)enterClient(s.phone);
  else if(s.role==='staff'&&user&&user.canEdit())enterStaff();
})();
</script>
</body>
</html>
